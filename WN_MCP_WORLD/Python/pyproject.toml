[project]
name = "wn-mcp-world"
version = "0.1.0"
description = "MCP tools for WN_MCP_WORLD commands (Actor, Blueprint, Component)"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.0.2",
    "pytest-cov>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires running UE editor (deselect with '-m not integration')",
    "e2e: end-to-end tests requiring UE editor (deselect with '-m not e2e')",
]
testpaths = ["tests"]

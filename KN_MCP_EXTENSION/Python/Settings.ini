[Logging]
# Log level: ERROR, WARNING, INFO, DEBUG, MISC (default: MISC)
# ERROR: Only errors | WARNING: Errors and warnings | INFO: General info | DEBUG: All messages | MISC: JSON payloads
LOG_LEVEL = MISC

# Log retention period in days (default: 7)
# Logs older than this will be automatically deleted
LOG_RETENTION_DAYS = 7

# Maximum number of log files to keep (default: 2)
# Keep latest n files (including current). 0 = unlimited (keep all)
MAX_LOG_FILES = 2

# Enable automatic cleanup of old logs (default: true)
LOG_AUTO_CLEANUP = true
